# Refresh every integrated national registry every 10 minutes and publish the
# results to the `data` branch in one commit. The pipeline code lives on
# `main`; the data branch is an orphan so its history never mixes with code.
# Countries run sequentially; one failing registry never blocks the others.
#
# Security posture:
#   * least-privilege GITHUB_TOKEN (contents:write only, nothing else)
#   * no third-party actions beyond actions/checkout
#   * no secrets required; the pipeline is stdlib-only Python
#   * concurrency group prevents overlapping runs racing on the data branch
name: Fetch registries

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Space-separated country codes to refresh (default: all)"
        default: "gr lt nl be lu fr de cy"
        type: string
      force_static:
        description: "Re-process static inventories even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  fetch:
    name: fetch and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Check out data branch (or start it)
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach data FETCH_HEAD
            git -C data checkout -q -B "$DATA_BRANCH"
          else
            echo "::notice::branch $DATA_BRANCH does not exist yet; creating it"
            git worktree add --detach data
            git -C data checkout -q --orphan "$DATA_BRANCH"
            git -C data rm -rfq . || true
            git -C data clean -fdxq
          fi
          git -C data config user.name "cpo-today-bot"
          git -C data config user.email "bot@cpo.today"

      - name: Run pipeline
        id: pipeline
        shell: bash
        working-directory: pipeline
        env:
          FORCE_STATIC: ${{ inputs.force_static && '--force-static' || '' }}
          COUNTRIES: ${{ inputs.countries || 'gr lt nl be lu fr de cy' }}
        run: |
          set -uo pipefail
          python3 --version
          rc=0
          for c in $COUNTRIES; do
            echo "::group::$c"
            if ! python3 -m cpo_pipeline "$c" --data-dir ../data $FORCE_STATIC; then
              echo "::warning::$c: pipeline reported a problem (see log); other countries continue"
              rc=1
            fi
            echo "::endgroup::"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        shell: bash
        working-directory: data
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          MSG=$(python3 - <<'PY'
          import json, glob
          parts = []
          for m in sorted(glob.glob("*/meta.json")):
              d = json.load(open(m))
              parts.append(f"{d.get('country','?').lower()} {d.get('dynamic',{}).get('source_ts','n/a')}")
          print("data: " + "; ".join(parts))
          PY
          )
          git commit -q -m "$MSG"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$DATA_BRANCH"; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing onto remote"
            git fetch --depth=5 origin "$DATA_BRANCH" || true
            git rebase FETCH_HEAD || { git rebase --abort; sleep $((attempt * 5)); continue; }
            sleep $((attempt * 3))
          done
          echo "::error::could not push data branch after 4 attempts"
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          for m in data/*/meta.json; do
            [ -f "$m" ] || continue
            {
              echo "### $(python3 -c "import json;d=json.load(open('$m'));print(d.get('country_name'), '(' + d.get('source','') + ')')")"
              echo '```json'
              python3 -c "import json;m=json.load(open('$m'));print(json.dumps({k:m.get(k) for k in ('last_run','static','tariffs','dynamic','warnings')},indent=1))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ steps.pipeline.outputs.rc }}" = "1" ]; then
            echo "::error::at least one registry failed this tick; data for the others was published"
            exit 1
          fi
